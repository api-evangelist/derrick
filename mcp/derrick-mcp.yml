name: Derrick MCP Server
generated: '2026-09-09'
method: searched
source: https://derrick-app.com/.well-known/mcp/server-card.json + https://app1.derrick-app.com/api/v1/docs/actions
  + npm derrick-mcp@0.3.0 (dist/tools.js) + live probe of https://app1.derrick-app.com/mcp
status: official
deployment:
  mode: both
  endpoint: https://app1.derrick-app.com/mcp
  install: npx -y derrick-mcp
  package: https://www.npmjs.com/package/derrick-mcp
  auth: oauth
  verified: probed
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
  checked: '2026-09-11'
  source: claimed-backlog re-probe 2026-09-11
transport:
  remote: streamable-http
  local: stdio
authentication:
  note: 'Remote endpoint answers anonymous POSTs with 401 Bearer invalid_token and RFC 9728 resource_metadata
    (probed 2026-09-09). OAuth 2.0 authorization-code + PKCE with dynamic client registration per RFC
    8414 metadata on app1.derrick-app.com; a Derrick API key sent as Authorization: Bearer also works
    per the server card. The stdio package reads DERRICK_API_KEY or ~/.derrick-mcp/.env. API keys require
    the Standard plan or above per the server card and llms.txt (pricing.md says Plus and above - see
    plans artifact).'
  oauth_authorization_server: https://app1.derrick-app.com/.well-known/oauth-authorization-server
  oauth_protected_resource: https://app1.derrick-app.com/.well-known/oauth-protected-resource/mcp
server_card: https://derrick-app.com/.well-known/mcp/server-card.json
actions_catalog:
  url: https://app1.derrick-app.com/api/v1/docs/actions
  note: Unauthenticated machine-readable catalog the MCP server itself uses to register dynamic tools
    at startup; saved verbatim to mcp/derrick-actions-catalog.json. Each action maps 1:1 to POST /api/v1/{apiSlug}
    on the REST API (X-API-Key auth).
  file: derrick-actions-catalog.json
  mcp_version:
    min: 0.3.0
    recommended: 0.3.0
    updateCommand: npm install -g derrick-mcp@latest
tool_count:
  dynamic: 32
  static: 5
static_tools:
- name: derrick_configure
  title: Configure Derrick API key
  description: Save your Derrick API key locally (stdio mode only).
  inputs:
  - name: api_key
    type: string
    required: true
- name: derrick_help
  title: Derrick help
  description: Overview of Derrick features, credits, errors, pricing, and scaling guidance.
  inputs:
  - name: topic
    type: string
    required: false
    description: credits | errors | pricing | scale | features
- name: derrick_credits
  title: Derrick credits balance
  description: Last known credits balance from the in-session cache.
  inputs: []
- name: derrick_account
  title: Derrick account info
  description: Live account info and remaining credits (GET /api/v1/account).
  inputs: []
- name: derrick_upgrade
  title: Upgrade Derrick plan
  description: Returns a Stripe Checkout URL for a chosen plan, or the live plan list (POST /api/v1/upgrade).
  inputs:
  - name: plan
    type: string
    required: false
    description: MINI, STANDARD, PLUS, or PRO. Omit to fetch the live plan list.
tools:
- name: derrick_google_maps_by_prompt
  title: Google Maps by prompt
  description: 'Type what you are looking for and where (e.g. "growth agency in London") and import up
    to 200 businesses into a new sheet: name, category, rating, reviews, phone, website, address and attributes.'
  category: AI
  credits_per_run: 1
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/google_maps_by_prompt
  inputs:
  - name: prompt
    type: string
    required: true
    description: Type what you are looking for and where, e.g. "agence seo marseille" or "growth agency
      in London". Always include a location.
- name: derrick_import_leads_from_prompt
  title: Import leads from prompt
  description: Describe your ideal lead in plain language and import the matching Sales Navigator profiles
    into a new sheet.
  category: AI
  credits_per_run: 1
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/import_leads_from_prompt
  inputs:
  - name: queryValue
    type: string
    required: true
    description: Describe your ideal lead
  - name: page
    type: string
    required: false
    description: Page to start from
- name: derrick_get_name_from_email
  title: Find Name from Email
  description: Find firstname, lastname and domain from an email.
  category: clean
  credits_per_run: 0
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/get_name_from_email
  inputs:
  - name: queryValue
    type: string
    required: true
    description: Select email column
- name: derrick_find_gender
  title: Find Gender from Name
  description: Remove all special characters from a full name and find their firstname, lastname and gender.
  category: clean
  credits_per_run: 1
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/find_gender
  inputs:
  - name: queryValue
    type: string
    required: true
    description: Select fullname column
- name: derrick_verify_email
  title: Verify Email
  description: Check if an email address is valid.
  category: clean::Lead
  credits_per_run: 1
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/verify_email
  inputs:
  - name: email
    type: string
    required: true
    description: Email address to verify
