- name: derrick_website_contact_social
  title: Enrich Website with Emails, Phones & Social Profiles
  description: Extracts emails, phone numbers, and social media links from a website.
  category: enrich::Company
  credits_per_run: 2
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/website_contact_social
  inputs:
  - name: website_url
    type: string
    required: true
    description: Enter a full website URL (e.g., example.com)
- name: derrick_find_tech
  title: Enrich Company with Website Technologies
  description: Get website technology (CMS, Framework, Analytics, CDN, Hosting, etc.)
  category: enrich::Company
  credits_per_run: 2
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/find_tech
  inputs:
  - name: website_url
    type: string
    required: true
    description: Choose Website URL
- name: derrick_website_crawler
  title: Enrich Website with Page Content
  description: 'Extract essential web page content: title, meta description, headings (H1-H5), page text
    (limited to 50,000 characters), and total character count.'
  category: enrich::Company
  credits_per_run: 2
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/website_crawler
  inputs:
  - name: url_column
    type: string
    required: true
    description: Choose URL column
- name: derrick_google_news
  title: Google News results
  description: 'For each company in your sheet, return its most relevant recent Google News article: title,
    link, publisher and date.'
  category: enrich::google
  credits_per_run: 1
  rest_endpoint: POST https://app1.derrick-app.com/api/v1/google_news
  inputs:
  - name: companyName
    type: string
    required: true
    description: Company name to search news for
  - name: period
    type: string
    required: true
    description: How far back to search
    options:
    - 1d
    - 7d
    - 30d
    - 90d
    - 180d
    - 365d
  - name: language
    type: string
    required: false
    description: Language of the news sources
    options:
    - en
    - fr
    - de
    - es
    - it
    - pt
    - nl
  - name: context
    type: string
    required: false
    description: Context (e.g. telecom)
