note: 'Derrick publishes an unusually rich discovery surface on its registrable domain: RFC 9116 security.txt,
  an RFC 9727 api-catalog (application/linkset+json) linking the REST API and MCP server, a legacy ai-plugin.json
  manifest, and an MCP server-card at /.well-known/mcp/server-card.json. The API host app1.derrick-app.com
  serves RFC 8414 OAuth authorization-server metadata (with dynamic client registration) and RFC 9728
  protected-resource metadata for the MCP endpoint. www.derrick-app.com 301-redirects most well-known
  paths to the apex but itself serves an orphaned easy-mcp-ai (WordPress-plugin-shaped) openid-configuration/oauth-authorization-server
  pair whose /wp-json endpoints 404 on the apex - recorded verbatim, flagged stale. app.derrick-app.com
  serves none.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
